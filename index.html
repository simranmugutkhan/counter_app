<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="counter_container">
        <h1 class="counter_name">Counter App</h1>
        <p class="count_display">0</p>
        <div class="step_container">
            <label for="step">Step:</label>
            <input type="number" name="step" id="step" value="1" min="1">
        </div>

        <div class="btns">
            <button class="increase_btn">Increase</button>
            <button type="reset" class="reset_btn">Reset</button>
            <button class="decrease_btn">Decrease</button>
        </div>
        <p class="count_status">Count is Zero</p>


    </div>
    <h1>Hello</h1>
    <script src="script.js"></script>
</body>

</html>
